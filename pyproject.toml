[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yuestudio"
version = "0.1.0"
description = "YuE Studio: a quality harness and studio UI for YuE2 song generation (mlx-Yue)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "numpy>=2.0",
  "scipy>=1.14",
  "soundfile>=0.12",
  "pypinyin>=0.51",
  "opencc-python-reimplemented>=0.1.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
asr = ["mlx-whisper>=0.4"]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
yue-studio = "yuestudio.cli:main"

[tool.setuptools.packages.find]
include = ["yuestudio*", "yuestudio_worker*"]

[tool.setuptools.package-data]
yuestudio = ["static/**/*", "style/*.json", "lyrics/*.json", "abc/_vendor/LICENSE-mlx-Yue", "db/*.sql"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["yuestudio/abc/_vendor", "fake_lyra/lyra/music_tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real audio models or long runtimes"]
